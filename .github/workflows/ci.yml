name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
    env:
      FLUTREES_LEGACY_SOURCE: ${{ github.workspace }}/validation/legacy/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5683105e015e19ccaa5744789de9ad8941331975
          path: validation/legacy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y mafft xvfb xauth python3-tk graphviz
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Check application types
        if: matrix.python-version == '3.11'
        run: |
          python -m mypy src/flutrees --ignore-missing-imports --check-untyped-defs
          python -m mypy src/flutrees/config.py src/flutrees/layout.py --strict --follow-imports=silent --ignore-missing-imports
      - name: Full scientific, compatibility and format-boundary tests
        run: xvfb-run -a python -m pytest --cov=flutrees --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=100 --junitxml=tests.xml
      - name: Require exact statement and branch coverage
        run: python -c "import json; t=json.load(open('coverage.json'))['totals']; assert t['missing_lines']==0 and t['missing_branches']==0 and t['excluded_lines']==0, t"
      - run: python -m build
      - name: Install built wheel and run all views outside the checkout
        run: |
          python -m venv /tmp/flutrees-wheel
          /tmp/flutrees-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/flutrees-wheel/bin/flutrees --version
          /tmp/flutrees-wheel/bin/flutrees --demo --tree-mode all --threads 1 --outdir /tmp/flutrees-example --run-id demo
          /tmp/flutrees-wheel/bin/flutrees -i "$GITHUB_WORKSPACE/tests/data/public_HA.fasta" --tree-mode all --threads 1 --outdir /tmp/flutrees-example --run-id public
      - name: Collect validated package and example files
        run: |
          mkdir -p validation/dist validation/examples/synthetic validation/examples/public
          cp coverage.json coverage.xml tests.xml validation/
          cp dist/* validation/dist/
          cp -R /tmp/flutrees-example/demo/. validation/examples/synthetic/
          cp -R /tmp/flutrees-example/public/. validation/examples/public/
      - uses: actions/upload-artifact@v4
        with:
          name: flutrees-validation-python-${{ matrix.python-version }}
          path: |
            validation/dist/
            validation/examples/
            validation/coverage.json
            validation/coverage.xml
            validation/tests.xml
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y mafft
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: flutrees --demo --tree-mode all --threads 1 --outdir /tmp/browser-run --run-id demo
      - run: python tests/browser_check.py /tmp/browser-run/demo/example/START_HERE.html

  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [venv, conda, uv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y mafft python3-venv python3-tk git curl
      - run: python -m pip install build
      - run: python -m build
      - name: Execute the README commands, including downloaded installers
        run: python scripts/check_readme_install.py --mode "${{ matrix.mode }}" --wheel dist/*.whl --ref "${{ github.event.pull_request.head.sha || github.sha }}" --output installer-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ matrix.mode }}
          path: installer-results/
          if-no-files-found: error

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        records: [100, 500, 1000, 5000, 10000, 25000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y mafft time
      - run: python -m pip install build
      - run: python -m build && python -m pip install dist/*.whl
      - name: Full HA ingestion, alignment, three views and every export
        run: python benchmarks/benchmark_end_to_end.py --sizes "${{ matrix.records }}" --threads 2 --outdir /tmp/flutrees-performance
      - name: Collect benchmark evidence
        if: always()
        run: |
          mkdir -p performance-results
          find /tmp/flutrees-performance -type f \( -name measurement.json -o -name resources.json -o -name cli.log \) -exec cp '{}' performance-results/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.records }}
          path: performance-results/
          if-no-files-found: error

  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y mafft
      - run: python -m pip install .
      - run: python benchmarks/benchmark_alignment.py --outdir /tmp/alignment-check
      - uses: actions/upload-artifact@v4
        with:
          name: alignment
          path: /tmp/alignment-check/alignment-comparison.json
          if-no-files-found: error

  package:
    needs: [test, browser, installers, performance, alignment]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: flutrees-validation-python-3.11
          path: validation
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          path: acceptance
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: acceptance
      - uses: actions/download-artifact@v4
        with:
          name: alignment
          path: acceptance/alignment
      - name: Package and verify release downloads
        id: package
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: flutrees-release
          path: build/release/
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: flutrees-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutrees-release
          path: release
      - name: Publish a new version after validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > existing-releases.txt
          if grep -Fxq "$tag" existing-releases.txt; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_main" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" > matching-tags.json
          jq -e --arg tag "refs/tags/$tag" '[.[] | select(.ref == $tag)] | length == 0' matching-tags.json
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "FluTrees $tag" --notes-file docs/RELEASE_NOTES.md --draft
          gh release edit "$tag" --draft=false --latest
