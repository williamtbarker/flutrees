name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y mafft xvfb xauth python3-tk graphviz
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Full coverage including real MAFFT and desktop workflow
        run: xvfb-run -a python -m pytest --cov=flutrees --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=100
      - name: Require exact statement and branch coverage
        run: python -c "import json; t=json.load(open('coverage.json'))['totals']; assert t['missing_lines']==0 and t['missing_branches']==0, t"
      - run: python -m build
      - name: Install built wheel and run the packaged example
        run: |
          python -m venv /tmp/flutrees-wheel
          /tmp/flutrees-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/flutrees-wheel/bin/flutrees --version
          /tmp/flutrees-wheel/bin/flutrees --demo --tree-mode all --threads 1 --outdir /tmp/flutrees-example --run-id demo
          /tmp/flutrees-wheel/bin/flutrees -i "$GITHUB_WORKSPACE/tests/data/public_HA.fasta" --tree-mode all --threads 1 --outdir /tmp/flutrees-example --run-id public
      - name: Collect validation files
        run: |
          mkdir -p validation/dist validation/examples/synthetic validation/examples/public
          cp coverage.json coverage.xml validation/
          cp dist/* validation/dist/
          cp -R /tmp/flutrees-example/demo/. validation/examples/synthetic/
          cp -R /tmp/flutrees-example/public/. validation/examples/public/
      - uses: actions/upload-artifact@v4
        with:
          name: flutrees-validation-python-${{ matrix.python-version }}
          path: validation/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y mafft
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: flutrees --demo --tree-mode all --threads 1 --outdir /tmp/browser-run --run-id demo
      - run: python tests/browser_check.py /tmp/browser-run/demo/example/START_HERE.html

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y mafft
      - run: python -m pip install uv build
      - run: python -m build
      - name: Verify uv environment
        run: |
          uv venv --python 3.11 /tmp/flutrees-uv
          uv pip install --python /tmp/flutrees-uv/bin/python dist/*.whl
          cd /tmp
          /tmp/flutrees-uv/bin/flutrees --demo --tree-mode all --threads 1 --outdir /tmp/uv-results --run-id demo
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: flutrees
          python-version: "3.11"
          channels: conda-forge,bioconda
          conda-remove-defaults: true
      - name: Verify conda environment
        shell: bash -el {0}
        run: |
          conda install --override-channels -c conda-forge -c bioconda --strict-channel-priority mafft tk pip -y
          python -m pip install dist/*.whl
          cd /tmp
          flutrees --demo --tree-mode all --threads 1 --outdir /tmp/conda-results --run-id demo

  package:
    needs: [test, browser, installers]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: flutrees-validation-python-3.11
          path: validation
      - name: Package and verify release downloads
        id: package
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          import runpy
          import shutil
          import tomllib
          import zipfile
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd()
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), version
          assert runpy.run_path("src/flutrees/__init__.py")["__version__"] == version
          assert f"version: {version}\n" in Path("CITATION.cff").read_text()
          assert Path("docs/RELEASE_NOTES.md").read_text().startswith(f"# FluTrees {version}\n")
          assert f"## {version} " in Path("CHANGELOG.md").read_text()
          wheel_name = f"flutrees-{version}-py3-none-any.whl"
          assert wheel_name in Path("docs/TESTING_GUIDE.md").read_text()
          totals = json.loads(Path("validation/coverage.json").read_text())["totals"]
          assert totals["missing_lines"] == totals["missing_branches"] == 0, totals

          kit = root / "build" / f"FluTrees_v{version}_Test_Kit"
          output = root / "build" / "release"
          (kit / "package").mkdir(parents=True)
          (kit / "example_inputs").mkdir()
          (kit / "validation").mkdir()
          output.mkdir()
          wheel = Path("validation/dist") / wheel_name
          sdist = Path("validation/dist") / f"flutrees-{version}.tar.gz"
          for file in (wheel, sdist):
              assert file.is_file() and file.stat().st_size > 0, file
              shutil.copy2(file, output / file.name)
          with zipfile.ZipFile(wheel) as archive:
              for source in Path("src/flutrees").rglob("*.py"):
                  assert archive.read(source.relative_to("src").as_posix()) == source.read_bytes(), source
          shutil.copy2(wheel, kit / "package" / wheel.name)
          shutil.copytree("validation/examples", kit / "examples")
          for source in ("src/flutrees/data/example.fasta", "tests/data/public_HA.fasta", "tests/data/public_HA_expected.json"):
              shutil.copy2(source, kit / "example_inputs" / Path(source).name)
          shutil.copy2("tests/data/README.md", kit / "example_inputs/PUBLIC_DATA_PROVENANCE.md")
          for source in ("README.md", "CHANGELOG.md", "LICENSE", "CITATION.cff", "docs/TESTING_GUIDE.md", "docs/RELEASE_NOTES.md"):
              shutil.copy2(source, kit / Path(source).name)
          (kit / "docs").mkdir()
          for source in Path("docs").iterdir():
              if source.suffix in {".md", ".json"}:
                  shutil.copy2(source, kit / "docs" / source.name)
          shutil.copy2("validation/coverage.json", kit / "validation/coverage-python311.json")
          shutil.copy2("docs/RELEASE_START.html", kit / "START_HERE.html")
          guide = html.escape((kit / "TESTING_GUIDE.md").read_text())
          (kit / "TESTING_GUIDE.html").write_text(
              '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
              '<title>FluTrees installation and testing</title><style>body{font:17px system-ui;max-width:950px;margin:auto;padding:30px;line-height:1.6}'
              'pre{white-space:pre-wrap;font:inherit}</style><p><a href="START_HERE.html">Back to Start here</a></p>'
              f'<pre>{guide}</pre></html>', encoding="utf-8")
          (kit / "BUILD_INFO.txt").write_text(
              f"FluTrees {version}\nSource commit: {os.environ['GITHUB_SHA']}\n"
              f"CI: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
              "The wheel and examples come from the Python 3.11 validation job in this CI run.\n"
              "Application statement and branch coverage: 100%.\n"
              "Python, third-party Python dependencies, and MAFFT are not bundled.\n", encoding="utf-8")
          for status in (kit / "examples").rglob("status.json"):
              assert json.loads(status.read_text())["status"] == "complete", status
          checksums = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(kit).as_posix()}\n"
                              for p in sorted(kit.rglob("*")) if p.is_file())
          (kit / "SHA256SUMS.txt").write_text(checksums, encoding="utf-8")

          class Links(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in {"href", "src"} and value:
                          parsed = urlsplit(value)
                          if not parsed.scheme and not parsed.netloc and parsed.path:
                              target = (self.folder / unquote(parsed.path)).resolve()
                              assert kit.resolve() in target.parents and target.is_file(), target

          for document in kit.rglob("*.html"):
              parser = Links()
              parser.folder = document.parent
              parser.feed(document.read_text())
          archive_path = output / f"{kit.name}.zip"
          with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(kit.rglob("*")):
                  if file.is_file():
                      archive.write(file, file.relative_to(kit.parent))
          with zipfile.ZipFile(archive_path) as archive:
              assert archive.testzip() is None
          shutil.copy2(kit / "examples/synthetic/example/tree_full.pdf", output / f"FluTrees_v{version}_Example_Tree.pdf")
          (output / "SHA256SUMS.txt").write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in sorted(output.iterdir())), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
          print(f"Verified release files for FluTrees {version}:")
          for file in sorted(output.iterdir()):
              print(f"  {file.name}: {file.stat().st_size} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flutrees-release
          path: build/release/
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: flutrees-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutrees-release
          path: release
      - name: Publish a new version after validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > existing-releases.txt
          if grep -Fxq "$tag" existing-releases.txt; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_main" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" > matching-tags.json
          jq -e --arg tag "refs/tags/$tag" '[.[] | select(.ref == $tag)] | length == 0' matching-tags.json
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "FluTrees $tag" --notes-file docs/RELEASE_NOTES.md --draft
          gh release edit "$tag" --draft=false --latest
