[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flutrees"
version = "0.1.0"
description = "Recovered and consolidated FluTrees Python package"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "William Barker"}]
license = "MIT"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "biopython>=1.80",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "typer>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.6",
  "build>=1",
]

[project.scripts]
flutrees = "flutrees.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
  "E501",  # line length: preserve recovered source formatting
  "E701",  # compact statements: preserve recovered source
  "E702",  # semicolon statements: preserve recovered source
  "I001",  # import ordering: do not rewrite recovered source solely for style
  "B008",  # Typer intentionally uses Option/Argument calls in defaults
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
