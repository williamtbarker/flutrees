[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flutrees"
version = "0.3.2"
description = "Toolkit for interpretable influenza HA mutation-tree analysis"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "William Barker"}]
license = "MIT"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "biopython>=1.80",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "pillow>=9.1",
  "typer>=0.9",
  "xlsxwriter>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.6",
  "build>=1",
  "pytest-cov>=5",
  "pypdf>=5",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "hypothesis>=6.100",
  "mypy>=1.10",
]

[project.scripts]
flutrees = "flutrees.cli:app"
flutrees-gui = "flutrees.gui:launch"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flutrees = ["data/*.fasta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["integration: requires real MAFFT", "gui: requires a graphical display"]

[tool.coverage.run]
branch = true
source = ["flutrees"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
  "E501",  # legacy line-length compatibility
  "E701",  # existing compact statement style
  "E702",  # existing semicolon statement style
  "I001",  # preserve established import ordering
  "B008",  # Typer intentionally uses Option/Argument calls in defaults
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
